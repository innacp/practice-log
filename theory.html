<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Theory · Muza</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.svg">
  <meta name="theme-color" content="#D100FF">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=Comfortaa:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body class="theory-page" data-title="title.theory">
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="/">
        <img class="logo" src="favicon.svg" width="34" height="34" alt="">
        <span class="wordmark" data-i18n="brand">Muza</span>
      </a>
      <nav class="nav" data-i18n-aria="nav.pages" aria-label="Pages">
        <a href="/practice" data-i18n="nav.log">Practice</a>
        <a href="/timer" data-i18n="nav.timer">Timer</a>
        <a href="/theory" aria-current="page" data-i18n="nav.theory">Theory</a>
      </nav>
      <div class="lang-switch" role="group" data-i18n-aria="lang.label" aria-label="Language">
        <button type="button" data-lang="en" lang="en">EN</button>
        <button type="button" data-lang="uk" lang="uk">UA</button>
      </div>
      <a class="admin-link" hidden href="/admin" data-i18n-aria="admin.link" aria-label="Admin: edit lessons" title="Admin">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
      </a>
      <a class="account-btn" href="/login" hidden>Log in</a>
    </div>
  </header>

  <main class="wrap theory-main">
    <section class="card theory-intro">
      <div>
        <h1 data-i18n="theory.h1">Music theory on the piano</h1>
        <p class="muted" data-i18n="theory.intro"></p>
      </div>
      <div class="lesson-progress">
        <div class="lp-bar"><span id="lp-fill"></span></div>
        <p class="muted" id="lp-text"></p>
      </div>
      <div class="chips" role="group" data-i18n-aria="theory.show" aria-label="Show lessons">
        <button type="button" class="chip on" data-filter="all" data-i18n="all">All</button>
        <button type="button" class="chip" data-filter="beginner" data-i18n="level.beginner">Beginner</button>
        <button type="button" class="chip" data-filter="intermediate" data-i18n="level.intermediate">Intermediate</button>
        <button type="button" class="chip" data-filter="advanced" data-i18n="level.advanced">Advanced</button>
      </div>
    </section>

    <!-- Lessons are written in lessons-1/2/3.js and drawn by theory.js -->
    <div class="lessons" id="lessons"></div>

    <p class="muted theory-foot"><span data-i18n="theory.foot1">Ready to practise?</span> <a href="/timer" data-i18n="theory.foot2">Start the timer</a> <span data-i18n="theory.foot3">and log what you worked on.</span></p>
  </main>

  <script src="i18n.js"></script>
  <script src="store.js"></script>
  <script src="lessons-1.js"></script>
  <script src="lessons-2.js"></script>
  <script src="lessons-3.js"></script>
  <script src="theory.js"></script>
</body>
</html>
