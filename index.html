<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Practice Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="brand">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><ellipse cx="12" cy="8" rx="8" ry="3"/><path d="M4 8v8c0 1.7 3.6 3 8 3s8-1.3 8-3V8"/><path d="M9 3l2 5M15 3l-2 5"/></svg>
        <span>Practice Log</span>
      </div>
      <span class="muted" id="today"></span>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <div class="streak-card">
        <div>
          <p class="eyebrow">Current streak</p>
          <p class="streak"><span id="streak">0</span><span class="unit"> days</span></p>
        </div>
        <div class="streak-stats">
          <div><b id="longest">0</b><span>longest streak</span></div>
          <div><b id="week">0</b><span>min this week</span></div>
          <div><b id="hours">0</b><span>hours total</span></div>
        </div>
      </div>

      <form class="card log" id="log-form">
        <h2>Log a session</h2>
        <div class="toggle" role="group" aria-label="Instrument">
          <button type="button" data-type="drums" class="on" aria-pressed="true">Drums</button>
          <button type="button" data-type="vocals" aria-pressed="false">Vocals</button>
        </div>
        <div class="two">
          <label>Date <input type="date" name="date" required></label>
          <label>How long
            <select name="minutes">
              <option value="15">15 min</option>
              <option value="20">20 min</option>
              <option value="30" selected>30 min</option>
              <option value="60">1 hour</option>
            </select>
          </label>
        </div>
        <label>What did you work on? <input type="text" name="notes" placeholder="e.g. paradiddles at 90 bpm"></label>
        <button type="submit" class="primary">Add session</button>
      </form>
    </section>

    <section class="card">
      <div class="row">
        <div>
          <h2>The last year</h2>
          <p class="muted" id="year-summary"></p>
        </div>
        <div class="tabs" role="tablist">
          <button type="button" role="tab" data-filter="all" class="on" aria-selected="true">All</button>
          <button type="button" role="tab" data-filter="drums" aria-selected="false">Drums</button>
          <button type="button" role="tab" data-filter="vocals" aria-selected="false">Vocals</button>
        </div>
      </div>
      <div class="graph-scroll"><div id="graph"></div></div>
      <div class="legend" id="legend"></div>
    </section>

    <section class="card">
      <div class="row">
        <h2>Recent sessions</h2>
        <div class="tools">
          <button type="button" class="ghost" id="export">Export</button>
          <label class="ghost">Import<input type="file" id="import" accept="application/json" hidden></label>
        </div>
      </div>
      <ul id="sessions"></ul>
    </section>
  </main>

  <div id="tip" hidden></div>
  <script src="app.js"></script>
</body>
</html>
