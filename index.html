<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Practice Log</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.svg">
  <meta name="theme-color" content="#D100FF">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="/">
        <img class="logo" src="favicon.svg" width="34" height="34" alt="">
        <span class="wordmark">Practice<b>Log</b></span>
      </a>
      <nav class="nav" aria-label="Pages">
        <a href="/" aria-current="page">Log</a>
        <a href="/timer">Timer</a>
        <a href="/theory">Theory</a>
      </nav>
      <div class="top-right">
        <span class="muted" id="today"></span>
        <span class="sync" id="sync" hidden></span>
        <button type="button" class="link" id="lock" hidden>Lock</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <form class="card unlock" id="unlock" hidden>
      <div>
        <h2>Unlock your log</h2>
        <p class="muted">Enter your passcode to load and save your progress online.</p>
      </div>
      <div class="unlock-row">
        <label class="sr-only" for="passcode">Passcode</label>
        <input type="password" id="passcode" autocomplete="current-password" placeholder="Passcode" required>
        <button type="submit" class="primary">Unlock</button>
      </div>
      <p class="error" id="unlock-error" role="alert" hidden></p>
    </form>

    <section class="hero">
      <div class="streak-card">
        <div class="streak-top">
          <div>
            <p class="eyebrow">Current streak</p>
            <p class="streak"><span id="streak">0</span><span class="unit"> days</span></p>
          </div>
          <div class="fire" aria-hidden="true">
            <div class="glow"></div>
            <div class="flame outer"></div>
            <div class="flame mid"></div>
            <div class="flame inner"></div>
            <span class="ember"></span><span class="ember"></span><span class="ember"></span><span class="ember"></span><span class="ember"></span>
          </div>
        </div>
        <div class="streak-stats">
          <div><b id="longest">0</b><span>longest streak</span></div>
          <div><b id="week">0</b><span>min this week</span></div>
          <div><b id="hours">0</b><span>hours total</span></div>
        </div>
      </div>

      <form class="card log" id="log-form">
        <h2>Log a session</h2>
        <div class="toggle" role="group" aria-label="Instrument">
          <button type="button" data-type="drums" class="on" aria-pressed="true">Drums</button>
          <button type="button" data-type="vocals" aria-pressed="false">Vocals</button>
        </div>
        <div class="two">
          <label>Date <input type="date" name="date" required></label>
          <label>How long
            <select name="minutes">
              <option value="15">15 min</option>
              <option value="20">20 min</option>
              <option value="30" selected>30 min</option>
              <option value="60">1 hour</option>
            </select>
          </label>
        </div>
        <label>What did you work on? <input type="text" name="notes" placeholder="e.g. paradiddles at 90 bpm"></label>
        <button type="submit" class="primary">Add session</button>
      </form>
    </section>

    <section class="duo">
      <div class="card goal">
        <div class="row">
          <div>
            <h2>Weekly goal</h2>
            <p class="muted" id="goal-sub"></p>
          </div>
          <button type="button" class="ghost" id="goal-edit">Edit goal</button>
        </div>
        <form class="goal-form" id="goal-form" hidden>
          <label for="goal-hours">Hours per week</label>
          <select class="field" id="goal-hours">
            <option value="60">1 hour</option>
            <option value="120">2 hours</option>
            <option value="180">3 hours</option>
            <option value="240">4 hours</option>
            <option value="300">5 hours</option>
            <option value="420">7 hours</option>
            <option value="600">10 hours</option>
            <option value="840">14 hours</option>
          </select>
          <button type="submit" class="primary small">Save</button>
          <button type="button" class="link" id="goal-cancel">Cancel</button>
        </form>
        <div class="goal-body">
          <div class="ring" id="goal-ring-wrap">
            <svg viewBox="0 0 140 140" aria-hidden="true">
              <circle class="ring-track" cx="70" cy="70" r="60"/>
              <circle class="ring-fill" id="goal-ring" cx="70" cy="70" r="60"/>
            </svg>
            <div class="ring-center"><b id="goal-pct">0%</b><span id="goal-of"></span></div>
          </div>
          <div class="week-bars" id="week-bars" aria-label="Minutes each day this week"></div>
        </div>
        <div class="split-legend goal-legend"><span class="k drums">Drums</span><span class="k vocals">Vocals</span><span class="k target">Daily target</span></div>
      </div>

      <div class="card recap">
        <div class="row">
          <h2>Monthly recap</h2>
          <div class="month-nav">
            <button type="button" class="icon-btn" id="recap-prev" aria-label="Previous month"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
            <span id="recap-month"></span>
            <button type="button" class="icon-btn" id="recap-next" aria-label="Next month"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
          </div>
        </div>
        <div id="recap-body"></div>
      </div>
    </section>

    <section class="card">
      <div class="row">
        <div>
          <h2>The last year</h2>
          <p class="muted" id="year-summary"></p>
        </div>
        <div class="tabs" role="tablist">
          <span class="tab-pill" aria-hidden="true"></span>
          <button type="button" role="tab" data-filter="all" class="on" aria-selected="true">All</button>
          <button type="button" role="tab" data-filter="drums" aria-selected="false">Drums</button>
          <button type="button" role="tab" data-filter="vocals" aria-selected="false">Vocals</button>
        </div>
      </div>
      <div class="graph-scroll"><div id="graph"></div></div>
      <div class="legend" id="legend"></div>
    </section>

    <section class="card">
      <div class="row">
        <h2>Recent sessions</h2>
        <div class="tools">
          <button type="button" class="ghost" id="export">Export</button>
          <label class="ghost">Import<input type="file" id="import" accept="application/json" hidden></label>
        </div>
      </div>
      <ul id="sessions"></ul>
    </section>
  </main>

  <div id="tip" hidden></div>
  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>
