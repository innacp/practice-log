<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timer · Practice Log</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.svg">
  <meta name="theme-color" content="#D100FF">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="timer-page">
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="/">
        <img class="logo" src="favicon.svg" width="34" height="34" alt="">
        <span class="wordmark">Practice<b>Log</b></span>
      </a>
      <nav class="nav" aria-label="Pages">
        <a href="/">Log</a>
        <a href="/timer" aria-current="page">Timer</a>
      </nav>
    </div>
  </header>

  <main class="wrap timer-main">
    <section class="card timer-card">
      <div class="toggle" role="group" aria-label="Instrument">
        <button type="button" data-type="drums" class="on" aria-pressed="true">Drums</button>
        <button type="button" data-type="vocals" aria-pressed="false">Vocals</button>
      </div>

      <div class="dial" id="dial">
        <svg viewBox="0 0 240 240" aria-hidden="true">
          <circle class="dial-track" cx="120" cy="120" r="108"/>
          <circle class="dial-fill" id="dial-fill" cx="120" cy="120" r="108"/>
        </svg>
        <div class="dial-center">
          <div class="time" id="time" role="timer" aria-live="off">00:00</div>
          <div class="dial-sub" id="dial-sub">Ready when you are</div>
        </div>
      </div>

      <div class="chips" role="group" aria-label="Session goal">
        <span class="chips-label">Goal</span>
        <button type="button" class="chip on" data-target="0">None</button>
        <button type="button" class="chip" data-target="15">15m</button>
        <button type="button" class="chip" data-target="20">20m</button>
        <button type="button" class="chip" data-target="30">30m</button>
        <button type="button" class="chip" data-target="60">1h</button>
      </div>

      <div class="timer-controls" id="controls">
        <button type="button" class="primary big" id="start">Start</button>
        <button type="button" class="ghost big" id="finish" disabled>Finish</button>
      </div>
      <button type="button" class="link" id="discard" hidden>Discard this session</button>

      <form class="finish-form" id="finish-form" hidden>
        <p class="finish-title" id="finish-title"></p>
        <label>What did you work on?
          <input type="text" id="notes" placeholder="e.g. paradiddles at 90 bpm" maxlength="500">
        </label>
        <div class="timer-controls">
          <button type="submit" class="primary big">Save session</button>
          <button type="button" class="ghost big" id="keep-going">Keep going</button>
        </div>
      </form>

      <p class="saved-msg" id="saved-msg" role="status" hidden></p>
    </section>

    <p class="muted timer-today" id="today-total"></p>
  </main>

  <script src="store.js"></script>
  <script src="timer.js"></script>
</body>
</html>
