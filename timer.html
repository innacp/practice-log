<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timer · Muza</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.svg">
  <meta name="theme-color" content="#D100FF">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=Comfortaa:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body class="timer-page" data-title="title.timer">
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="/">
        <img class="logo" src="favicon.svg" width="34" height="34" alt="">
        <span class="wordmark" data-i18n="brand">Muza</span>
      </a>
      <nav class="nav" data-i18n-aria="nav.pages" aria-label="Pages">
        <a href="/practice" data-i18n="nav.log">Practice</a>
        <a href="/timer" aria-current="page" data-i18n="nav.timer">Timer</a>
        <a href="/theory" data-i18n="nav.theory">Theory</a>
        <a href="/friends" data-i18n="nav.friends">Friends</a>
      </nav>
      <div class="lang-switch" role="group" data-i18n-aria="lang.label" aria-label="Language">
        <button type="button" data-lang="en" lang="en">EN</button>
        <button type="button" data-lang="uk" lang="uk">UA</button>
      </div>
      <a class="admin-link" hidden href="/admin" data-i18n-aria="admin.link" aria-label="Admin: edit lessons" title="Admin">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
      </a>
      <a class="account-btn" href="/login" hidden>Log in</a>
    </div>
  </header>

  <main class="wrap timer-main">
    <section class="card timer-card">
      <div class="toggle" id="inst-toggle" role="group" data-i18n-aria="instrument" aria-label="Instrument"></div>

      <div class="dial" id="dial">
        <svg viewBox="0 0 240 240" aria-hidden="true">
          <circle class="dial-track" cx="120" cy="120" r="108"/>
          <circle class="dial-glow" id="dial-glow" cx="120" cy="120" r="108"/>
          <circle class="dial-fill" id="dial-fill" cx="120" cy="120" r="108"/>
        </svg>
        <div class="dial-center">
          <div class="time" id="time" role="timer" aria-live="off">00:00</div>
          <div class="dial-sub" id="dial-sub">Ready when you are</div>
        </div>
      </div>

      <div class="chips" role="group" data-i18n-aria="timer.goalGroup" aria-label="Session goal">
        <span class="chips-label" data-i18n="timer.goal">Goal</span>
        <button type="button" class="chip on" data-target="0">None</button>
        <button type="button" class="chip" data-target="15">15m</button>
        <button type="button" class="chip" data-target="20">20m</button>
        <button type="button" class="chip" data-target="30">30m</button>
        <button type="button" class="chip" data-target="60">1h</button>
      </div>

      <div class="timer-controls" id="controls">
        <button type="button" class="primary big" id="start">Start</button>
        <button type="button" class="ghost big" id="finish" disabled data-i18n="timer.finish">Finish</button>
      </div>
      <button type="button" class="link" id="discard" hidden data-i18n="timer.discard">Discard this session</button>
      <div class="rec" id="rec-timer" hidden></div>

      <form class="finish-form" id="finish-form" hidden>
        <p class="finish-title" id="finish-title"></p>
        <label><span data-i18n="log.notes">What did you work on?</span>
          <input type="text" id="notes" placeholder="e.g. paradiddles at 90 bpm" data-i18n-ph="log.ph" maxlength="500">
        </label>
        <div class="timer-controls">
          <button type="submit" class="primary big" data-i18n="timer.save">Save session</button>
          <button type="button" class="ghost big" id="keep-going" data-i18n="timer.keep">Keep going</button>
        </div>
      </form>

      <p class="saved-msg" id="saved-msg" role="status" hidden></p>
    </section>

    <section class="card metro-card" aria-labelledby="metro-title">
      <div class="metro-head">
        <h2 id="metro-title" data-i18n="metro.title">Metronome</h2>
        <span class="metro-name" id="metro-name">Andante</span>
      </div>

      <div class="metro-beats" id="metro-dots" aria-hidden="true"></div>

      <div class="metro-tempo">
        <button type="button" class="icon-btn metro-step" id="metro-down" data-i18n-aria="metro.slower" aria-label="Slower">−</button>
        <div class="metro-bpm"><b id="metro-bpm">90</b><span>BPM</span></div>
        <button type="button" class="icon-btn metro-step" id="metro-up" data-i18n-aria="metro.faster" aria-label="Faster">+</button>
      </div>
      <input type="range" id="metro-range" min="30" max="240" step="1" value="90" data-i18n-aria="metro.tempo" aria-label="Tempo">

      <div class="chips" role="group" data-i18n-aria="metro.beats" aria-label="Beats per bar">
        <span class="chips-label" data-i18n="metro.beats">Beats per bar</span>
        <button type="button" class="chip" data-beats="2">2</button>
        <button type="button" class="chip" data-beats="3">3</button>
        <button type="button" class="chip on" data-beats="4">4</button>
        <button type="button" class="chip" data-beats="6">6</button>
      </div>

      <div class="timer-controls">
        <button type="button" class="primary big" id="metro-play" data-i18n="metro.start">Start</button>
        <button type="button" class="ghost big" id="metro-tap" data-i18n="metro.tap">Tap tempo</button>
      </div>
      <label class="metro-link"><input type="checkbox" id="metro-with-timer"> <span data-i18n="metro.withTimer">Start and stop with the timer</span></label>
    </section>

    <p class="muted timer-today" id="today-total"></p>
  </main>

  <script src="i18n.js"></script>
  <script src="store.js"></script>
  <script src="recorder.js"></script>
  <script src="timer.js"></script>
  <script src="metronome.js"></script>
</body>
</html>
